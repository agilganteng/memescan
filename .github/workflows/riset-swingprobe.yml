name: riset-swingprobe
on:
  push:
    branches: [strat100k]
    paths: [riset/swing_probe.py, .github/workflows/riset-swingprobe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u riset/swing_probe.py
