name: riset-lulus-maju2

# 19 Nov: uji maju 3 aturan beku lulus_cari2 di koin setelah 18 Nov 06:45 UTC.
on:
  push:
    branches: [strat100k]
    paths: [riset/lulus_maju2.py, .github/workflows/riset-lulus-maju2.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cari:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: lulus-data-none
          restore-keys: lulus-data-
      - run: python3 -u riset/lulus_maju2.py --data data
