name: perps-jam

# Riset 18 Nov: strategi dalam hari (candle 1 jam) di Binance futures.
on:
  push:
    branches: [main]
    paths: [perps_jam.py, .github/workflows/perps-jam.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy
      - uses: actions/cache/restore@v4
        with:
          path: pcache
          key: perps-data-none
          restore-keys: perps-data-
      - uses: actions/cache/restore@v4
        with:
          path: hcache
          key: perps-h1-none
          restore-keys: perps-h1-
      - run: mkdir -p out && python3 -u perps_jam.py --out out
      - name: Tanpa biaya (hanya untuk melihat ada tidaknya keunggulan kotor)
        run: FEE=0 python3 -u perps_jam.py --out out0 | grep -E "^\[(kel|jam)\]|^  .*: A total"
      - name: Biaya maker 0,04% per perputaran
        run: FEE=0.0004 python3 -u perps_jam.py --out out4 | grep -E "^\[(kel|jam)\]|^  .*: A total"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: hcache
          key: perps-h1-${{ github.run_id }}
