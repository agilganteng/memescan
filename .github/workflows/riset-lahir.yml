name: riset-lahir

# Riset sekali jalan: beli saat koin lahir, jual cepat. Hanya baca cache.
on:
  push:
    branches: [strat100k]
    paths: [riset/lahir.py, riset/kol.py, .github/workflows/riset-lahir.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riset-lahir
  cancel-in-progress: true

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: memescan-data-none
          restore-keys: memescan-data-
      - run: pip install -q numpy
      - name: Beli saat lahir
        run: python3 -u riset/lahir.py --data data
