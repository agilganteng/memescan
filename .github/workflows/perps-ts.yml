name: perps-ts

# Riset 15 Nov: strategi ikut tren per koin (time-series) di Binance futures.
on:
  push:
    branches: [main]
    paths: [perps_ts.py, perps_xs.py, .github/workflows/perps-ts.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy
      - uses: actions/cache/restore@v4
        with:
          path: pcache
          key: perps-data-none
          restore-keys: perps-data-
      - run: mkdir -p out && python3 -u perps_ts.py --out out
