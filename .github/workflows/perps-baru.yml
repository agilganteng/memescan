name: perps-baru

# Riset 15 Nov: short koin baru listing di Binance futures + panen funding. Pilih 2023-2024, uji 2025-sekarang.
on:
  push:
    branches: [main]
    paths: [perps_baru.py, .github/workflows/perps-baru.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: pcache
          key: perps-data-none
          restore-keys: perps-data-
      - run: mkdir -p out && python3 -u perps_baru.py --out out
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pcache
          key: perps-data-${{ github.run_id }}
      - run: head -c 30000 out/perps_baru.json
