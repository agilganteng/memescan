name: riset-sector

# Riset sekali jalan: backtest aturan "Grok Bot Terminal" @sector_sol (lonjakan volume, dev<=2%, ukuran 33%, TP 2R, SL 15%, keluar saat volume pudar), modal $100/$200/$1000.
# Hanya baca cache rekaman, tidak ada transaksi.
on:
  push:
    branches: [strat100k]
    paths: [riset/sector.py, riset/rugikk.py, riset/insider4.py, .github/workflows/riset-sector.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riset-sector
  cancel-in-progress: true

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: memescan-data-none
          restore-keys: memescan-data-
      - run: pip install -q numpy
      - name: Backtest sector_sol
        run: python3 -u riset/sector.py --data data
