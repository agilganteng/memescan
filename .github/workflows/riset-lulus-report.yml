name: riset-lulus-report

# 18 Nov: laporan uji koin lulusan PumpSwap dari data perekam maju (tanpa menyimpan cache).
on:
  push:
    branches: [strat100k]
    paths: [riset/lulus_report.py, .github/workflows/riset-lulus-report.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laporan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: lulus-data-none
          restore-keys: lulus-data-
      - run: python3 -u riset/lulus_report.py --data data
