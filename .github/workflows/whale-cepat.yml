name: whale-cepat

# Uji riset sekali jalan: N whale beli dalam rentang waktu singkat. Hanya baca cache rekaman, tidak menulis apa pun.
on:
  push:
    branches: [main]
    paths: [whale_cepat.py, .github/workflows/whale-cepat.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: memescan-data-none
          restore-keys: memescan-data-
      - run: python3 -u whale_cepat.py --data data
