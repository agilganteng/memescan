name: riset-lulus-probe

# Cek cepat 4 menit: apakah GeckoTerminal + DexScreener bisa dibaca dan lulusan terdeteksi. Data dibuang.
on:
  push:
    branches: [strat100k]
    paths: [.github/workflows/riset-lulus-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -u riset/lulus.py run --data probe --duration 240
      - run: python3 riset/lulus.py status --data probe
