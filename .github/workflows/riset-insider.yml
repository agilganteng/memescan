name: riset-insider

# Riset sekali jalan: copy wallet insider (dev, bundler, sniper detik pertama). Hanya baca cache.
on:
  push:
    branches: [strat100k]
    paths: [riset/insider.py, riset/kol.py, .github/workflows/riset-insider.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riset-insider
  cancel-in-progress: true

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: memescan-data-none
          restore-keys: memescan-data-
      - run: pip install -q numpy
      - name: Uji copy insider
        run: python3 -u riset/insider.py --data data
