name: whale-grid
# 14 Nov: dipakai juga untuk --banyak (daftar besar x banyak whale)

# Riset: uji 144 varian syarat wallet whale x N whale x 2 cara jual. Pilih di periode 3, uji SEKALI di periode 4.
on:
  push:
    branches: [main]
    paths: [.github/workflows/whale-grid.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: memescan-data-none
          restore-keys: memescan-data-
      - run: mkdir -p out && python3 -u whale_scan.py --data data --out out --banyak
