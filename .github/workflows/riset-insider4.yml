name: riset-insider4

# Riset sekali jalan: backtest aturan post X @x_insider4 (Grok Bot desk) + 41.472 gabungan, modal $100/$200/$1000.
# Hanya baca cache rekaman, tidak ada transaksi.
on:
  push:
    branches: [strat100k]
    paths: [riset/insider4.py, .github/workflows/riset-insider4.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riset-insider4
  cancel-in-progress: true

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: memescan-data-none
          restore-keys: memescan-data-
      - run: pip install -q numpy
      - name: Backtest x_insider4
        run: python3 -u riset/insider4.py --data data
