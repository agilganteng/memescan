name: riset-bevan

# Riset sekali jalan: backtest aturan dari semua video Bevan. Hanya baca cache.
on:
  push:
    branches: [strat100k]
    paths: [riset/bevan.py, .github/workflows/riset-bevan.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riset-bevan
  cancel-in-progress: true

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: memescan-data-none
          restore-keys: memescan-data-
      - run: pip install -q numpy
      - name: Backtest Bevan
        run: python3 -u riset/bevan.py --data data
