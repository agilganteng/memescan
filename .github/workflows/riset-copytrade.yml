name: riset-copytrade

# Riset sekali jalan: apakah copy trade wallet top kolscan untung? Hanya jalan di branch copytrade-riset,
# tidak menyentuh memescan, cache, atau Telegram. Hasil: log langkah "Analisa" + riset/data/raw.json.gz di branch ini.
on:
  push:
    branches: [copytrade-riset]
    paths: [riset/copytrade.py, riset/DEBUG, .github/workflows/riset-copytrade.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riset-copytrade
  cancel-in-progress: true

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Debug alamat
        if: hashFiles('riset/DEBUG') != ''
        run: python3 riset/copytrade.py debug --wallets 12 --rate 3
      - name: Uji singkat
        if: hashFiles('riset/DEBUG') == ''
        run: |
          python3 riset/copytrade.py fetch --out /tmp/smoke --wallets 1 --max-sigs 40 --minutes 2
          python3 riset/copytrade.py analyze --out /tmp/smoke
      - name: Ambil data
        if: hashFiles('riset/DEBUG') == ''
        run: python3 riset/copytrade.py fetch --out riset/data --wallets 12 --max-sigs 2500 --days 7 --minutes 170 --rate 7 --threads 8
      - name: Analisa
        if: always() && hashFiles('riset/DEBUG') == ''
        run: python3 riset/copytrade.py analyze --out riset/data | tee riset/data/hasil.txt
      - name: Simpan data ke branch
        if: always() && hashFiles('riset/DEBUG') == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f riset/data
          git commit -m "riset copytrade: data $(date -u +%Y%m%d-%H%M) [skip ci]" || exit 0
          git push origin HEAD:copytrade-riset
