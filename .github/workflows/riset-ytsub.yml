name: riset-ytsub

# Ambil subtitle semua video YouTube/TikTok Bevan Pramudito, simpan ke branch strat100k (riset/yt/).
on:
  workflow_dispatch:
  push:
    branches: [strat100k]
    paths: [riset/yt-request.txt]

permissions:
  contents: write

jobs:
  ambil:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Pasang yt-dlp
        run: pip install -q -U "yt-dlp[default]"
      - name: Ambil subtitle
        run: python3 -u riset/yt_subs.py
      - name: Simpan
        if: always()
        run: |
          rm -rf riset/yt/raw
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add riset/yt
          git commit -qm "riset: subtitle video Bevan" && (git pull -q --rebase origin strat100k; git push -q) || echo "tidak ada perubahan"
