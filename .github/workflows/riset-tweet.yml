name: riset-tweet

# Baca satu postingan X (teks + gambar/frame video) lewat API publik, lalu simpan ke branch strat100k.
on:
  workflow_dispatch:
    inputs:
      user:
        required: true
      id:
        required: true
  push:
    branches: [strat100k]
    paths: [riset/tweet-request.txt]

permissions:
  contents: write

jobs:
  baca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Baca postingan
        run: |
          if [ -n "${{ github.event.inputs.id }}" ]; then U="${{ github.event.inputs.user }}"; I="${{ github.event.inputs.id }}"; else read U I < riset/tweet-request.txt; fi
          python3 -u riset/baca_tweet.py "$U" "$I"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add riset/tweet
          git commit -qm "riset: isi postingan X $I" && git push -q || echo "tidak ada perubahan"
