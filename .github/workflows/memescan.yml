name: memescan smoke test

# Bukan tempat jalan 24 jam (GitHub tidak dibuat untuk bot dan jadwalnya molor berjam-jam).
# Bot aslinya jalan di VPS lewat install-vps.sh. Workflow ini cuma tes manual:
# sambung ke RPC publik Solana beberapa menit, lalu tampilkan kandidat yang tercatat.
# Telegram sengaja tidak dipakai di sini supaya chat tidak kena pesan tes.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Berapa menit"
        default: "10"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "websockets>=10"
      - name: Jalan
        run: python3 -u memescan.py --data /tmp/ms --duration $(( ${{ github.event.inputs.minutes }} * 60 ))
      - name: Hasil
        if: always()
        run: |
          python3 memescan.py status --data /tmp/ms
          echo "--- candidates.jsonl"
          cat /tmp/ms/candidates.jsonl 2>/dev/null | head -c 20000 || echo "(kosong)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memescan-data
          path: /tmp/ms/candidates.jsonl
          if-no-files-found: ignore
