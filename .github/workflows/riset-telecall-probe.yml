name: riset-telecall-probe

# Cek sekali sumber callout (Telegram publik, mirror X, pump.fun) dari GitHub Actions. Hanya branch strat100k.
on:
  push:
    branches: [strat100k]
    paths: [riset/telecall_probe.py, .github/workflows/riset-telecall-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -u riset/telecall_probe.py
