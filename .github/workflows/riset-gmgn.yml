name: riset-gmgn

# Cek sekali: jalur akses GMGN (API resmi, browser otomatis, nitter) dari GitHub Actions. Hanya baca, tanpa login.
on:
  push:
    branches: [strat100k]
    paths: [riset/gmgn_probe.py, riset/gmgn_social_probe.py, .github/workflows/riset-gmgn.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q playwright && python3 -m playwright install --with-deps chromium
      - run: python3 -u riset/gmgn_social_probe.py
