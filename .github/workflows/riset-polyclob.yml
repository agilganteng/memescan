name: riset-polyclob

# Uji pola streak di data asli Polymarket 5 menit (API publik, tanpa key, tanpa trading).
on:
  push:
    branches: [strat100k]
    paths: [riset/polyclob.py, .github/workflows/riset-polyclob.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u riset/polyclob.py
