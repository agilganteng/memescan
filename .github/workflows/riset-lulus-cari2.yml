name: riset-lulus-cari2

# 18 Nov: putaran lanjutan pencarian lulusan PumpSwap dengan uji maju otomatis (set 2 dan 3).
on:
  push:
    branches: [strat100k]
    paths: [riset/lulus_cari2.py, .github/workflows/riset-lulus-cari2.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cari:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: lulus-data-none
          restore-keys: lulus-data-
      - run: python3 -u riset/lulus_cari2.py --data data --set 2
      - run: python3 -u riset/lulus_cari2.py --data data --set 3
