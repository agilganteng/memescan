name: riset-polybtc

# Riset sekali jalan: bias jam/menit pasar Polymarket BTC Up/Down 5 menit (candle 5m Binance spot, tanpa key, tanpa trading).
on:
  push:
    branches: [strat100k]
    paths: [riset/polybtc.py, .github/workflows/riset-polybtc.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riset-polybtc2
  cancel-in-progress: true

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy
      - name: Uji bias waktu Polymarket 5 menit
        run: python3 -u riset/polybtc.py
