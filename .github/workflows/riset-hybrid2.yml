name: riset-hybrid2

# Riset sekali jalan: backtest "Hybrid Multi-Agent v2.0 (Ketat)" di rekaman 7 hari terakhir. Hanya baca cache.
on:
  push:
    branches: [strat100k]
    paths: [riset/hybrid2.py, .github/workflows/riset-hybrid2.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riset-hybrid2
  cancel-in-progress: true

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: rugdesk-data-none
          restore-keys: rugdesk-data-
      - run: if [ -d data ]; then mv data data-rd; fi
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: memescan-data-none
          restore-keys: memescan-data-
      - run: pip install -q numpy
      - name: Backtest Hybrid v2 ketat
        run: python3 -u riset/hybrid2.py --data data --rugdesk data-rd
